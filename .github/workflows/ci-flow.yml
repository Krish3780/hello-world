name: CI deployment
on: push
jobs:
  fetch-code:
    runs-on: ubuntu-latest
    steps:
      - name: get the code from repo
        uses: actions/checkout@v5
      - name: list the files    
        run: |
          ls -l
          pwd
  build:
    needs: fetch-code
    runs-on: ubuntu-latest
    steps:
      - name: check out the code
        uses: actions/checkout@v5
      - name: check java and maven version
        run: |
          java -version
          mvn --version  
      - name: build the code
        run:  mvn clean package  
      - name: list files
        run: |
          ls -l
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: ./webapp/target/webapp.war
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Action to enable Buildx for advanced Docker builds

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: . # Path to your Dockerfile and build context
          push: true # Push the image to Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/krishna3780/github-actions-repo:latest
      - name: Build and push Docker image manually
        run: |
          docker version
          docker build -t krishna3780/github-actions-repo .
          docker push krishna3780/github-actions-repo:latest
          


